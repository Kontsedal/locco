name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a branch cancels the run still going for the first one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One failing Node version should still report the others.
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7
        ports:
          - 6380:6379
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:coverage
      # Builds first, so publint and attw always read a fresh dist rather than a stale one.
      - run: npm run check:package
