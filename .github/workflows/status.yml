name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a branch cancels the run still going for the first one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # One failing Node version should still report the others.
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    services: &backends
      redis:
        image: redis:7
        ports:
          - 6380:6379
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to a commit, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency needs an install script, so none gets to run one.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:coverage
      # Builds first, so publint and attw always read a fresh dist rather than a stale one.
      - run: npm run check:package

  lowest-drivers:
    name: Lowest supported drivers
    runs-on: ubuntu-latest
    services: *backends
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The lockfile tests the newest drivers. The peer ranges also promise these, the oldest ones,
      # which no lockfile can hold next to the newest. pg 8.0.0 to 8.0.2 cannot authenticate with
      # the SCRAM that current Postgres requires, so the range starts at 8.0.3.
      - run: npm install --no-save --ignore-scripts ioredis@5.0.0 redis@4.0.0 mongodb@5.7.0 pg@8.0.3 # zizmor: ignore[adhoc-packages]
      - run: npm run test:run

  consumer:
    name: Consumer on TypeScript ${{ matrix.typescript }}, vitest ${{ matrix.vitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest TypeScript the README promises, and the oldest vitest the peer range does.
          - typescript: '5.2'
            vitest: '1'
          - typescript: latest
            vitest: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:consumer -- --typescript "$TYPESCRIPT" --vitest "$VITEST"
        env:
          TYPESCRIPT: ${{ matrix.typescript }}
          VITEST: ${{ matrix.vitest }}
