name: Publish

on:
  push:
    tags: ['v*']

# Releases run one at a time. A second tag waits rather than racing the first to the registry.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7
        ports:
          - 6380:6379
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      tag: ${{ steps.dist.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # Actions are pinned to a commit, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the dist-tag step can tell whether the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: a release must not restore files that another workflow wrote.
          package-manager-cache: false
      # No dependency needs an install script, so none gets to run one.
      - run: npm ci --ignore-scripts
      - name: Check that the tag matches package.json
        run: |
          VERSION="$(npm pkg get version | tr -d '"')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION."
            exit 1
          fi
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:run
      # Builds first, so publint and attw always read a fresh dist rather than a stale one.
      - run: npm run check:package
      - run: npm run check:consumer
      - name: Pick the dist-tag
        id: dist
        run: |
          VERSION="$(npm pkg get version | tr -d '"')"
          LATEST="$(npm view @kontsedal/locco dist-tags.latest 2>/dev/null || true)"
          TAG="$(node scripts/release-dist-tag.mjs "$VERSION" "$LATEST")"
          # "latest" is what a plain `npm install` gives everyone, so it moves only from main.
          if [ "$TAG" = latest ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$VERSION would become latest, but $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          echo "Publishing $VERSION under the \"$TAG\" dist-tag."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Pack
        id: pack
        # check:consumer has just built dist, so the pack does not run the build again.
        run: |
          TARBALL="$(npm pack --ignore-scripts --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Required reviewers and the tags allowed to deploy live on this environment, in the
    # repository settings. npm trusts this workflow only when it runs in it.
    environment: npm
    permissions:
      contents: read
      # Trusted publishing trades this job's OIDC token for a publish token that lasts minutes, and
      # signs the provenance statement with it. There is no long-lived npm token to leak.
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # This job runs no project code. It publishes the tarball the verify job tested.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Check that npm supports trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const atLeast = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!atLeast) {
              console.error("npm " + process.argv[1] + " cannot use trusted publishing, which needs 11.5.1.");
              process.exit(1);
            }
          ' "$(npm --version)"
      - run: npm publish "./$TARBALL" --provenance --access public --tag "$TAG"
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          TAG: ${{ needs.verify.outputs.tag }}
